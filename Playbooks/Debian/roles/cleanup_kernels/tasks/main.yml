---
- name: Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Build list of installed kernel packages
  ansible.builtin.set_fact:
    kernel_packages: >-
      {{ ansible_facts.packages.keys()
        | select('match', '^linux-image-[0-9].*')
        | list
        | community.general.version_sort }}

- name: Get list of kernels to remove (keep newest two)
  ansible.builtin.set_fact:
    kernels_to_remove: "{{ kernel_packages[:-2] if kernel_packages | length > 2 else [] }}"

- name: Remove old kernels
  become: true
  ansible.builtin.apt:
    name: "{{ kernels_to_remove }}"
    state: absent
    purge: true
  when: kernels_to_remove | length > 0

- name: Autoremove unused packages
  become: true
  ansible.builtin.apt:
    autoremove: true
    purge: true
