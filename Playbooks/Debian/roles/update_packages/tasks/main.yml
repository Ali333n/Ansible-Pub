---
- name: Get running kernel version
  ansible.builtin.set_fact:
    running_kernel: "{{ ansible_facts['kernel'] }}"

- name: Update Apt Cache
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: update_apt_cache | default(true) | bool

- name: Upgrade Apt Packages
  become: true
  ansible.builtin.apt:
    autoclean: true
    upgrade: dist
    autoremove: true

- name: Gather package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Check if system has linux-image packages (not LXC/Container)
  ansible.builtin.set_fact:
    has_linux_image_packages: "{{ (ansible_facts.packages.keys() | select('match',
      '^linux-image-[0-9].*') | reject('search', 'meta') | length) > 0 }}"
  changed_when: false

- name: Get latest installed kernel version
  ansible.builtin.set_fact:
    latest_installed_kernel: "{{ (ansible_facts.packages.keys() | select('match',
      '^linux-image-[0-9].*') | reject('search', 'meta') | list |
      community.general.version_sort)[-1] | regex_replace('^linux-image-', '') }}"
  changed_when: false
  when: has_linux_image_packages

- name: Check If System Reboot Is Required
  become: true
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: Set fact if reboot and notification are required
  ansible.builtin.set_fact:
    notify_reboot_required: true
  when: reboot_required.stat.exists

- name: Build Discord payload for reboot required
  ansible.builtin.set_fact:
    reboot_notification_json:
      embeds:
        - title: "{{ ansible_facts['hostname'] }} wird neu gestartet!"
          color: 16098851
          fields:
            - name: "Host"
              value: "{{ ansible_facts['hostname'] }}"
              inline: true
            - name: "Grund"
              value: "{{ 'Kernel-Update (' + running_kernel + ' → ' + latest_installed_kernel
                + ')' if (has_linux_image_packages and running_kernel !=
                latest_installed_kernel) else 'Paket-Upgrade' }}"
              inline: true
  when: reboot_required.stat.exists

- name: Send Discord Message about reboot
  ansible.builtin.uri:
    url: "{{ webhook_url }}"
    method: POST
    body_format: json
    body: "{{ reboot_notification_json }}"
    headers:
      Content-Type: application/json
    status_code: 204
  delegate_to: localhost
  become: false
  when: reboot_required.stat.exists

- name: Reboot if required
  become: true
  ansible.builtin.reboot:
    msg: "{{ 'Rebooting after kernel update or reboot-required' if
      has_linux_image_packages else 'Rebooting after package upgrade' }}"
    pre_reboot_delay: 0
    post_reboot_delay: 60
  when:
    - reboot_required.stat.exists or (has_linux_image_packages and
      running_kernel != latest_installed_kernel)
