---
- name: Fail if not a Debian-based system
  ansible.builtin.fail:
    msg: "This role only supports Debian-family systems"
  when: ansible_facts['distribution'] not in ['Debian', 'Ubuntu']

- name: Check disk space available
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      df -Ph / | awk 'NR==2 {print $5}'
    executable: /bin/bash
  changed_when: "false"
  check_mode: "false"
  register: disk_usage

- name: Build Discord payload for disk space warning
  ansible.builtin.set_fact:
    disk_notification_json:
      embeds:
        - title: "Disk Space Warnung — {{ ansible_facts['hostname'] }}"
          color: 15158332
          fields:
            - name: "Host"
              value: "{{ ansible_facts['hostname'] }}"
              inline: true
            - name: "Auslastung"
              value: "{{ disk_usage.stdout }}"
              inline: true
            - name: "Hinweis"
              value: "Updates werden übersprungen"
              inline: false
  when: disk_usage.stdout[:-1] | int > 80

- name: Send Discord message if disk space is above 80%
  ansible.builtin.uri:
    url: "{{ webhook_url }}"
    method: POST
    body_format: json
    body: "{{ disk_notification_json }}"
    headers:
      Content-Type: application/json
    status_code: 204
  delegate_to: localhost
  become: false
  when:
    - disk_usage.stdout[:-1] | int > 80
    - webhook_url | default('') | length > 0
  failed_when: false

- name: Stop execution if disk space is above 90%
  ansible.builtin.meta: end_host
  when: disk_usage.stdout[:-1] | int > 90
