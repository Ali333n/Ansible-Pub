---
- name: Check for Updates and Notify via Discord
  hosts: all
  vars:
    ansible_python_interpreter: /usr/bin/python3
    update_details_list: []
  gather_facts: true

  tasks:
    # Refresh package cache to get latest available versions
    - name: Update package cache
      ansible.builtin.apt:
        update_cache: true
      become: true

    # Simulate dist upgrade to detect available updates without installing
    - name: Simulate distribution upgrade
      ansible.builtin.apt:
        upgrade: dist
      check_mode: true
      register: apt_sim
      become: true

    # Extract package name, current and new version from apt output
    - name: Parse package update details
      ansible.builtin.set_fact:
        update_details_list: "{{ update_details_list | default([]) + [{'name': item.0, 'old_version': item.1, 'new_version': item.2}] }}"
      loop: "{{ apt_sim.stdout | regex_findall('Inst\\s+(\\S+)\\s+\\[([^\\]]+)\\]\\s+\\(([^\\s]+)', multiline=True) }}"
      when:
        - apt_sim.stdout is defined
        - "'Inst ' in apt_sim.stdout"

    # Format update information for Discord webhook
    - name: Build package fields list
      ansible.builtin.set_fact:
        package_fields: "{{ package_fields | default([]) + [{'name': item.name, 'value': '`' + item.old_version + '` → `' + item.new_version + '`', 'inline': false}] }}"
      loop: "{{ update_details_list }}"
      when: update_details_list | default([]) | length > 0

    # Split packages into groups of 25 (Discord limit: 25 fields/embed, max 250 Packages)
    - name: Build chunked package embeds
      ansible.builtin.set_fact:
        package_embeds: >-
          {{
            package_embeds | default([]) + [{
              'color': 5793266,
              'fields': package_fields[item * 25 : (item + 1) * 25]
            }]
          }}
      loop: "{{ range(0, (package_fields | length / 25) | round(0, 'ceil') | int) | list }}"
      when: package_fields is defined and package_fields | length > 0

    # First embed contains header info, followed by package chunks
    - name: Build Discord notification payload
      ansible.builtin.set_fact:
        update_notification_json:
          embeds: >-
            {{
              [{
                'title': 'Available Updates — ' + ansible_facts['hostname'],
                'color': 5793266,
                'fields': [
                  {'name': 'Host', 'value': ansible_facts['hostname'], 'inline': true},
                  {'name': 'Update Count', 'value': update_details_list | length | string, 'inline': true}
                ]
              }] + (package_embeds | default([]))
            }}
      when: update_details_list | default([]) | length > 0

    - name: Send Discord notification
      when: update_details_list | default([]) | length > 0
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body: "{{ update_notification_json }}"
        headers:
          Content-Type: application/json
        status_code: 204
      delegate_to: localhost
      become: false
