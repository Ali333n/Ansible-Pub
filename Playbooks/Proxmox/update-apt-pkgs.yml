---
- name: Upgrade and notify if reboot required
  hosts: all
  vars:
    ansible_python_interpreter: /usr/bin/python3
  gather_facts: true

  tasks:
    # Get installed kernel packages before upgrade
    - name: Get installed kernel packages before upgrade
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | grep -E '^ii.*(kernel|linux-image)-[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: kernel_before
      changed_when: false

    # Upgrade packages
    - name: Upgrade APT packages
      become: true
      ansible.builtin.apt:
        autoclean: true
        update_cache: true
        autoremove: true
        upgrade: dist

    # Get installed kernel packages after upgrade
    - name: Get installed kernel packages after upgrade
      ansible.builtin.shell: |
        set -o pipefail
        dpkg -l | grep -E '^ii.*(kernel|linux-image)-[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | sort
      args:
        executable: /bin/bash
      register: kernel_after
      changed_when: false

    # Check if reboot is required
    - name: Check if system reboot is required
      become: true
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    # Build Kernel update Notification
    - name: Build kernel fields list
      ansible.builtin.set_fact:
        kernel_fields: "{{ kernel_fields | default([]) + [{'name': item, 'value': 'Neu installiert', 'inline': false}] }}"
      loop: "{{ kernel_after.stdout_lines | difference(kernel_before.stdout_lines) }}"
      when: kernel_before.stdout != kernel_after.stdout

    - name: Build Discord payload for new kernel
      ansible.builtin.set_fact:
        kernel_notification_json:
          embeds:
            - title: "Neuer Kernel installiert — {{ ansible_facts['hostname'] }}"
              color: 15158332
              fields: >-
                {{
                  [
                    {'name': 'Host', 'value': ansible_facts['hostname'], 'inline': true},
                    {'name': 'Neustart erforderlich', 'value': 'Ja', 'inline': true}
                  ] + kernel_fields | default([])
                }}
      when: kernel_before.stdout != kernel_after.stdout

    # Send notification for new kernel update
    - name: Send Discord notification for new kernel
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body: "{{ kernel_notification_json }}"
        headers:
          Content-Type: application/json
        status_code: 204
      delegate_to: localhost
      become: false
      when: kernel_before.stdout != kernel_after.stdout

    # Build notification for reboot required
    - name: Build Discord payload for reboot required
      ansible.builtin.set_fact:
        reboot_notification_json:
          embeds:
            - title: "Neustart erforderlich — {{ ansible_facts['hostname'] }}"
              color: 16098851
              fields:
                - name: "Host"
                  value: "{{ ansible_facts['hostname'] }}"
                  inline: true
                - name: "Grund"
                  value: "Paket-Upgrade"
                  inline: true
      when: reboot_required.stat.exists and kernel_before.stdout == kernel_after.stdout

    # Send notification for reboot required
    - name: Send Discord notification for reboot required
      ansible.builtin.uri:
        url: "{{ webhook_url }}"
        method: POST
        body_format: json
        body: "{{ reboot_notification_json }}"
        headers:
          Content-Type: application/json
        status_code: 204
      delegate_to: localhost
      become: false
      when: reboot_required.stat.exists and kernel_before.stdout == kernel_after.stdout
