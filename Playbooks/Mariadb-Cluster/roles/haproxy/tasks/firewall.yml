---
- name: Configure the HAProxy firewall with UFW
  when: haproxy_firewall_enabled | bool
  block:
    - name: Install UFW on the load balancer
      ansible.builtin.apt:
        name: ufw
        state: present

    - name: Allow SSH before enabling UFW on the load balancer
      community.general.ufw:
        rule: allow
        port: "{{ haproxy_ssh_port }}"
        proto: tcp

    - name: Allow the HAProxy frontend from configured client networks
      community.general.ufw:
        rule: allow
        src: "{{ client_network }}"
        port: "{{ haproxy_frontend_port }}"
        proto: tcp
      loop: "{{ haproxy_allowed_client_networks }}"
      loop_control:
        loop_var: client_network

    - name: Set the default incoming UFW policy on the load balancer
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set the default outgoing UFW policy on the load balancer
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW on the load balancer
      community.general.ufw:
        state: enabled
