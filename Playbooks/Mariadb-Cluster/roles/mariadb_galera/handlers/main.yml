---
- name: Restart MariaDB
  ansible.builtin.systemd_service:
    name: "{{ mariadb_service_name }}"
    state: restarted
  when: not (galera_initial_setup | default(false) | bool)

- name: Restart Galera health endpoint
  ansible.builtin.systemd_service:
    name: "{{ galera_healthcheck_service_name }}"
    state: restarted
    daemon_reload: true
