---
- name: Validate Galera prerequisites
  ansible.builtin.include_tasks: validate.yml

- name: Configure the optional MariaDB repository
  ansible.builtin.include_tasks: repository.yml

- name: Install MariaDB and Galera packages
  ansible.builtin.include_tasks: install.yml

- name: Configure MariaDB and Galera
  ansible.builtin.include_tasks: configure.yml

- name: Configure the optional database firewall
  ansible.builtin.include_tasks: firewall.yml
